# Render.com blueprint: build and run from repo root
services:
  - type: web
    name: training-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && python init_db.py && gunicorn -b 0.0.0.0:$PORT --timeout 60 -w 1 --threads 4 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: run:app
