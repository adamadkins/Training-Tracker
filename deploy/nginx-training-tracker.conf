# Nginx server block for Training Tracker
# 1. Replace YOUR_DOMAIN_OR_IP with your domain (e.g. app.example.com) or server IP.
# 2. Install: sudo cp deploy/nginx-training-tracker.conf /etc/nginx/sites-available/training-tracker
#            sudo ln -s /etc/nginx/sites-available/training-tracker /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# 3. For HTTPS: sudo certbot --nginx -d YOUR_DOMAIN_OR_IP

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}
