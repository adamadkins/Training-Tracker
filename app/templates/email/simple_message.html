<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body style="margin:0; padding:24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.6; color: #1e293b; background: #f8fafc;">
    <div style="max-width: 520px; margin: 0 auto;">
        <h1 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 16px 0;">{{ title }}</h1>
        <div style="white-space: pre-wrap; color: #475569;">{{ body }}</div>
        {% if link_url %}
        <p style="margin-top: 24px;"><a href="{{ link_url }}" style="display: inline-block; padding: 12px 24px; background: #4f46e5; color: white; text-decoration: none; font-weight: 600; border-radius: 10px;">Open link</a></p>
        {% endif %}
    </div>
</body>
</html>
