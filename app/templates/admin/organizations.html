{% extends "base.html" %}
{% block content %}
<div class="admin-page">
    <div class="page-header">
        <h1 class="page-title">Organizations</h1>
        <a href="{{ url_for('admin.organization_create') }}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New organization</a>
    </div>
    <div class="table-card">
        <table class="admin-table">
            <thead>
                <tr><th>Name</th><th>Subdomain</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
                {% for org in organizations %}
                <tr>
                    <td><a href="{{ url_for('admin.organization_detail', org_id=org.id) }}">{{ org.name }}</a></td>
                    <td><code>{{ org.subdomain }}</code></td>
                    <td><span class="status status-{{ org.status }}">{{ org.status }}</span></td>
                    <td><a href="{{ url_for('admin.organization_detail', org_id=org.id) }}">View</a></td>
                </tr>
                {% else %}
                <tr><td colspan="4">No organizations yet. <a href="{{ url_for('admin.organization_create') }}">Create one</a>.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<style>
.admin-page { max-width: 100%; }
.page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
.page-title { font-size: 28px; font-weight: 800; margin: 0; color: var(--text-main); }
.table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table th, .admin-table td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); }
.admin-table th { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.admin-table td { font-size: 14px; color: var(--text-main); }
.admin-table a { color: var(--primary); font-weight: 600; text-decoration: none; }
.admin-table a:hover { text-decoration: underline; }
.admin-table code { font-size: 12px; background: var(--bg-body); padding: 2px 8px; border-radius: 6px; }
.status { font-size: 11px; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.status-active { background: #dcfce7; color: #166534; }
.status-suspended { background: #fee2e2; color: #991b1b; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; border: none; cursor: pointer; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { opacity: 0.9; }
</style>
{% endblock %}
