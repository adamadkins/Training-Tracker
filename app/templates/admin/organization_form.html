{% extends "base.html" %}
{% block content %}
<div class="admin-page">
    <div class="page-header">
        <a href="{{ url_for('admin.organizations_list') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Organizations</a>
    </div>
    <div class="form-card">
        <h1 class="page-title">Create organization</h1>
        <form method="post" class="admin-form">
            <label for="name">Organization name</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}" required placeholder="Acme Inc">
            <label for="subdomain">Subdomain</label>
            <input type="text" id="subdomain" name="subdomain" value="{{ subdomain or '' }}" required placeholder="acme">
            <p class="form-hint">Users will sign in at <strong><span id="subdomain-preview">subdomain</span>.{{ request.host.split(':')[0] }}</strong></p>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>
<style>
.admin-page { max-width: 480px; }
.page-header { margin-bottom: 20px; }
.back-link { color: var(--text-muted); font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.back-link:hover { color: var(--primary); }
.form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
.page-title { font-size: 24px; font-weight: 800; margin: 0 0 24px 0; color: var(--text-main); }
.admin-form { display: flex; flex-direction: column; gap: 16px; }
.admin-form label { font-size: 13px; font-weight: 700; color: var(--text-main); }
.admin-form input { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; background: var(--input-bg); color: var(--text-main); }
.admin-form input:focus { outline: none; border-color: var(--primary); }
.form-hint { font-size: 13px; color: var(--text-muted); margin: 0; }
.btn { padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; background: var(--primary); color: white; width: fit-content; }
.btn:hover { opacity: 0.9; }
</style>
<script>
document.getElementById('subdomain').addEventListener('input', function() {
    var v = this.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '') || 'subdomain';
    document.getElementById('subdomain-preview').textContent = v;
});
</script>
{% endblock %}
