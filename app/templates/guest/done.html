<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Session Complete - Training Tracker</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.10);
            padding: 48px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .checkmark {
            width: 72px;
            height: 72px;
            background: #ecfdf5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: #16a34a;
        }
        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #1e293b;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .message {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .message b { color: #1e293b; }
        .detail-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .detail-label { color: #64748b; font-weight: 600; }
        .detail-val { color: #1e293b; font-weight: 800; }
        .footer-note {
            margin-top: 32px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .brand {
            margin-top: 28px;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.04em;
        }
        .brand b { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="checkmark">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1>Evaluation Submitted</h1>
        <p class="message">
            The training evaluation for <b>{{ trainee }}</b> on <b>{{ position }}</b>
            has been recorded. Your manager has been notified.
        </p>

        <div class="detail-row">
            <span class="detail-label">Trainee</span>
            <span class="detail-val">{{ trainee }}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Position</span>
            <span class="detail-val">{{ position }}</span>
        </div>

        <p class="footer-note">
            This link has been deactivated. You're all set - you can close this page.
        </p>

        <p class="brand">Training<b>Tracker</b></p>
    </div>
</body>
</html>
