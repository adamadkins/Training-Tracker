<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link Expired - Training Tracker</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.10);
            padding: 48px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .icon {
            width: 72px;
            height: 72px;
            background: #fff7ed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: #f97316;
        }
        h1 { font-size: 26px; font-weight: 900; color: #1e293b; letter-spacing: -0.02em; margin-bottom: 12px; }
        .message { font-size: 15px; color: #64748b; line-height: 1.7; }
        .brand { margin-top: 36px; font-size: 12px; font-weight: 700; color: #94a3b8; }
        .brand b { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <i class="fa-solid fa-clock"></i>
        </div>
        <h1>Link Expired</h1>
        <p class="message">
            This guest trainer link has either expired or has already been used.
            <br><br>
            Please contact your manager to request a new link.
        </p>
        <p class="brand">Training<b>Tracker</b></p>
    </div>
</body>
</html>
