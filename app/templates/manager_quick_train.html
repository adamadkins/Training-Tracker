{% extends "base.html" %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: var(--bg-card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
        
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 64px; height: 64px; background: #e0f2fe; color: #0284c7; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px auto;">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1 style="font-size: 28px; font-weight: 900; color: var(--text-main); margin: 0;">Quick Train</h1>
            <p style="color: var(--text-muted); margin-top: 8px;">Start an ad-hoc session immediately.</p>
        </div>

        <form method="POST">
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em;">
                    Who are you training?
                </label>
                <select name="trainee_id" id="traineeSelect" required style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); font-size: 16px; outline: none;">
                    <option value="" disabled selected>Select Trainee...</option>
                    {% for t in trainees %}
                    <option value="{{ t.id }}" data-location-ids="{{ t.location_ids() | join(',') }}">{{ t.first_name }} {{ t.last_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 32px;">
                <label style="display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em;">
                    What position?
                </label>
                <select name="position_id" id="positionSelect" required style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); font-size: 16px; outline: none;">
                    <option value="" disabled selected>Select Position...</option>
                    {% for p in positions %}
                    <option value="{{ p.id }}" data-location-id="{{ p.location_id or '' }}">{{ p.name }}{% if p.location %} ({{ p.location.name }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: flex; gap: 12px;">
                <a href="javascript:history.back()" style="flex: 1; padding: 14px; text-align: center; border-radius: 12px; font-weight: 700; color: var(--text-muted); text-decoration: none; border: 1px solid var(--border);">
                    Cancel
                </a>
                <button type="submit" style="flex: 2; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s;">
                    Start Session <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
</div>
<script>
(function() {
    var traineeSelect = document.getElementById('traineeSelect');
    var positionSelect = document.getElementById('positionSelect');
    var allOptions = Array.from(positionSelect.querySelectorAll('option[value]'));

    traineeSelect.addEventListener('change', function() {
        var opt = traineeSelect.options[traineeSelect.selectedIndex];
        var locIdsStr = opt.getAttribute('data-location-ids') || '';
        var locIds = locIdsStr ? locIdsStr.split(',').map(function(s) { return s.trim(); }) : [];
        positionSelect.value = '';

        allOptions.forEach(function(o) {
            var posLoc = o.getAttribute('data-location-id');
            var show = !posLoc || (locIds.length === 0) || (posLoc && locIds.indexOf(posLoc) !== -1);
            o.style.display = show ? '' : 'none';
            o.disabled = !show;
        });
    });
})();
</script>
{% endblock %}
