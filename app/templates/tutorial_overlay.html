<style>
    .tutorial-backdrop {
        position: fixed; inset: 0; z-index: 10000;
        background: transparent;
        transition: opacity 0.3s;
        opacity: 0;
        pointer-events: all;
    }
    .tutorial-backdrop.active { opacity: 1; }

    .tutorial-spotlight {
        position: fixed; z-index: 10001;
        border-radius: 12px;
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
        transition: top 0.35s ease, left 0.35s ease, width 0.35s ease, height 0.35s ease;
        pointer-events: none;
    }

    .tutorial-tooltip {
        position: fixed; z-index: 10002;
        background: var(--bg-card, #fff); color: var(--text-main, #1e293b);
        border: 1px solid var(--border, #e2e8f0);
        border-radius: 20px;
        padding: 28px;
        max-width: 380px; width: calc(100vw - 40px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        transition: top 0.35s ease, left 0.35s ease, opacity 0.25s;
    }

    .tutorial-step-counter {
        font-size: 11px; font-weight: 800; color: var(--text-muted, #94a3b8);
        text-transform: uppercase; letter-spacing: 0.08em;
        margin-bottom: 8px;
    }

    .tutorial-title {
        font-size: 18px; font-weight: 800; color: var(--text-main, #1e293b);
        margin: 0 0 8px 0;
    }

    .tutorial-desc {
        font-size: 14px; color: var(--text-muted, #64748b); line-height: 1.65;
        margin: 0 0 24px 0;
    }

    .tutorial-actions {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }

    .tutorial-btn-skip {
        background: none; border: none; color: var(--text-muted, #94a3b8);
        font-size: 13px; font-weight: 700; cursor: pointer;
        padding: 10px 0; min-height: 44px;
        transition: color 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .tutorial-btn-skip:hover { color: var(--text-main, #64748b); }

    .tutorial-btn-next {
        background: var(--primary, #4f46e5); color: white; border: none;
        padding: 12px 24px; min-height: 44px;
        border-radius: 12px;
        font-size: 14px; font-weight: 700; cursor: pointer;
        display: flex; align-items: center; gap: 8px;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        -webkit-tap-highlight-color: transparent;
    }
    .tutorial-btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4); }

    .tutorial-dots {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .tutorial-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--border, #e2e8f0); transition: all 0.3s;
    }
    .tutorial-dot.active { background: var(--primary, #4f46e5); width: 20px; border-radius: 4px; }

    @media (max-width: 900px) {
        .tutorial-spotlight { display: none !important; }
        .tutorial-tooltip {
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            padding: 24px 20px; max-width: calc(100vw - 32px);
            width: calc(100vw - 32px);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            margin: 0;
            border-radius: 16px;
        }
        .tutorial-title { font-size: 17px; }
        .tutorial-desc { font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
        .tutorial-actions { margin-top: 20px; }
        .tutorial-btn-skip, .tutorial-btn-next { min-height: 48px; }
    }

    @supports (padding: max(0px)) {
        @media (max-width: 900px) {
            .tutorial-tooltip {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }
        }
    }
</style>

<div class="tutorial-backdrop" id="tutorialBackdrop"></div>
<div class="tutorial-spotlight" id="tutorialSpotlight"></div>
<div class="tutorial-tooltip" id="tutorialTooltip" style="opacity: 0;">
    <div class="tutorial-step-counter" id="tutorialCounter"></div>
    <h3 class="tutorial-title" id="tutorialTitle"></h3>
    <p class="tutorial-desc" id="tutorialDesc"></p>
    <div class="tutorial-dots" id="tutorialDots"></div>
    <div class="tutorial-actions" style="margin-top: 16px;">
        <button class="tutorial-btn-skip" id="tutorialSkip" type="button">Skip</button>
        <button class="tutorial-btn-next" id="tutorialNext" type="button">Next <i class="fa-solid fa-arrow-right" style="font-size: 12px;"></i></button>
    </div>
</div>

<script>
(function() {
    var role = '{{ current_user.role }}';

    var managerSteps = [
        { target: null, title: 'Welcome, Manager', desc: 'This quick tour shows you where everything lives. On desktop we\'ll highlight each part of the nav; on mobile, tap the menu icon (☰) at the top to open the same links. You can replay this anytime from Settings.' },
        { target: '[data-tutorial="staff"]', title: 'People', desc: 'Add team members, view profiles, and track progress. Assign roles (manager, trainer, trainee), attach employees to locations, and graduate trainees when they\'re ready.' },
        { target: '[data-tutorial="positions"]', title: 'Positions & Checklists', desc: 'Define each training position (e.g. Front Counter, Drive Thru) and the competency checklist used when rating a session. Edit criteria and order so evaluations stay consistent.' },
        { target: '[data-tutorial="roadmaps"]', title: 'Training Roadmaps', desc: 'Build step-by-step learning paths for each position. Trainees complete steps in order; progress is tracked automatically and shows on dashboards and schedules.' },
        { target: '[data-tutorial="dayparts"]', title: 'Dayparts', desc: 'Set up dayparts (e.g. Breakfast, Lunch, Dinner) for your locations. Used by the smart scheduler to match trainees with trainers on the same shift.' },
        { target: '[data-tutorial="locations"]', title: 'Locations', desc: 'Manage your locations and assign employees to them. Schedules and roadmaps can be scoped by location.' },
        { target: '[data-tutorial="schedule"]', title: 'Schedules', desc: 'Create weekly training schedules: use Smart Schedule to auto-build from a work schedule PDF, or build manually. Publish when ready so trainers and trainees see their sessions.' },
        { target: '[data-tutorial="messages"]', title: 'Messages', desc: 'Team channels and direct messages live here. Use them for training updates, quick questions, and announcements without leaving the app.' },
        { target: '[data-tutorial="settings"]', title: 'Settings', desc: 'Configure rating scales, sign-off rules, notifications, and other system-wide options. You can also replay this tour from here.' }
    ];

    var trainerSteps = [
        { target: null, title: 'Welcome, Trainer', desc: 'This short tour shows you the main areas. On desktop we\'ll highlight each link; on mobile, tap the menu icon (☰) to open the same navigation. You can replay this from Settings.' },
        { target: '[data-tutorial="dashboard"]', title: 'Your Dashboard', desc: 'Your home base: see how many sessions you have scheduled and completed, your next session, and any overdue evaluations. Use Quick Train for on-the-fly ratings.' },
        { target: '[data-tutorial="schedule"]', title: 'My Schedule', desc: 'View all your assigned training sessions. Tap a session to open the rating form and submit an evaluation. Overdue sessions are highlighted so you can stay on top of them.' },
        { target: '[data-tutorial="messages"]', title: 'Messages', desc: 'Chat with managers and teammates in channels or DMs. Great for coordinating training or asking questions without leaving Training Tracker.' },
        { target: '[data-tutorial="notifications"]', title: 'Notifications', desc: 'New schedule assignments, nudges from managers, and other updates show up here. Check this when you get a notification so nothing slips through.' }
    ];

    var traineeSteps = [
        { target: null, title: 'Welcome, Trainee', desc: 'This quick tour points you to the main areas. On desktop we\'ll highlight each link; on mobile, tap the menu icon (☰) to open the same navigation. You can replay this from your profile or Settings.' },
        { target: '[data-tutorial="dashboard"]', title: 'Your Dashboard', desc: 'See your training at a glance: upcoming sessions, completed sessions, and roadmap progress. You\'ll always know what\'s next and how you\'re doing.' },
        { target: '[data-tutorial="schedule"]', title: 'My Schedule', desc: 'View when and where your training sessions are and who your trainer is. Tap a session to see details. Come back after a session to see your scores once your trainer submits.' },
        { target: '[data-tutorial="messages"]', title: 'Messages', desc: 'Reach out to your trainer or team with questions. Handy when you need a quick answer without tracking someone down in person.' },
        { target: '[data-tutorial="notifications"]', title: 'Notifications', desc: 'When schedules are published, sessions are completed, or scores are posted, you\'ll see it here. Check this so you never miss an update.' }
    ];

    var steps = role === 'manager' ? managerSteps : (role === 'trainer' ? trainerSteps : traineeSteps);
    var currentStep = 0;

    var backdrop = document.getElementById('tutorialBackdrop');
    var spotlight = document.getElementById('tutorialSpotlight');
    var tooltip = document.getElementById('tutorialTooltip');
    var titleEl = document.getElementById('tutorialTitle');
    var descEl = document.getElementById('tutorialDesc');
    var counterEl = document.getElementById('tutorialCounter');
    var dotsEl = document.getElementById('tutorialDots');
    var nextBtn = document.getElementById('tutorialNext');
    var skipBtn = document.getElementById('tutorialSkip');

    function buildDots() {
        dotsEl.innerHTML = '';
        for (var i = 0; i < steps.length; i++) {
            var dot = document.createElement('div');
            dot.className = 'tutorial-dot' + (i === currentStep ? ' active' : '');
            dotsEl.appendChild(dot);
        }
    }

    function positionTooltip(rect) {
        var tw = Math.min(380, window.innerWidth - 40);
        var th = tooltip.offsetHeight || 240;
        var pad = 16;
        var top, left;

        if (rect.bottom + pad + th < window.innerHeight) {
            top = rect.bottom + pad;
        } else if (rect.top - pad - th > 0) {
            top = rect.top - pad - th;
        } else {
            top = Math.max(20, (window.innerHeight - th) / 2);
        }

        left = Math.max(20, Math.min(rect.left, window.innerWidth - tw - 20));
        tooltip.style.top = top + 'px';
        tooltip.style.left = left + 'px';
    }

    function showStep(idx) {
        if (idx >= steps.length) { finish(); return; }
        currentStep = idx;
        var step = steps[idx];
        var el = step.target ? document.querySelector(step.target) : null;

        counterEl.textContent = 'Step ' + (idx + 1) + ' of ' + steps.length;
        titleEl.textContent = step.title;
        descEl.textContent = step.desc;
        buildDots();

        nextBtn.innerHTML = (idx === steps.length - 1)
            ? 'Finish <i class="fa-solid fa-check" style="font-size:12px;"></i>'
            : 'Next <i class="fa-solid fa-arrow-right" style="font-size:12px;"></i>';

        var isMobile = window.innerWidth <= 900;

        if (el && !isMobile) {
            var rect = el.getBoundingClientRect();
            if (rect.width === 0 && rect.height === 0) {
                spotlight.style.display = 'none';
                tooltip.style.top = '50%';
                tooltip.style.left = '50%';
                tooltip.style.transform = 'translate(-50%, -50%)';
            } else {
                var sp = 6;
                spotlight.style.top = (rect.top - sp) + 'px';
                spotlight.style.left = (rect.left - sp) + 'px';
                spotlight.style.width = (rect.width + sp * 2) + 'px';
                spotlight.style.height = (rect.height + sp * 2) + 'px';
                spotlight.style.display = 'block';
                tooltip.style.transform = '';
                positionTooltip(rect);
            }
        } else {
            spotlight.style.display = 'none';
            tooltip.style.top = '50%';
            tooltip.style.left = '50%';
            tooltip.style.transform = 'translate(-50%, -50%)';
        }

        tooltip.style.opacity = '1';
    }

    function finish() {
        backdrop.style.opacity = '0';
        tooltip.style.opacity = '0';
        spotlight.style.display = 'none';
        setTimeout(function() {
            backdrop.remove();
            spotlight.remove();
            tooltip.remove();
        }, 350);
        fetch('{{ url_for("employee.api_tutorial_seen") }}', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    }

    nextBtn.addEventListener('click', function() { showStep(currentStep + 1); });
    skipBtn.addEventListener('click', finish);
    backdrop.addEventListener('click', function(e) { if (e.target === backdrop) finish(); });

    setTimeout(function() {
        backdrop.classList.add('active');
        showStep(0);
    }, 600);

    window.addEventListener('resize', function() { showStep(currentStep); });
})();
</script>
