{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="max-width: 450px;">
        <div class="auth-header">
            <div class="logo-icon large" style="background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 style="margin-top: 16px;">Set Your Password</h1>
            <p>Enter a secure password to access your training dashboard. This link is valid for 30 minutes.</p>
        </div>

        <form method="post" class="auth-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
            </div>

            <div style="margin-top: 32px;">
                <button type="submit" class="btn-primary wide" style="width: 100%;">
                    Save and Login
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
